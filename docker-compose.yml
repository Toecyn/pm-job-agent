# `docker compose up --build` runs the whole stack: the app + a Postgres
# database (required — see ARCHITECTURE.md §5, serverless/ephemeral
# filesystems can't use SQLite, and this project now uses Postgres
# everywhere rather than special-casing Docker).
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env so the container always
      # talks to the `postgres` service below, not a host-local address.
      DATABASE_URL: "postgresql://pmjobagent:pmjobagent@postgres:5432/pmjobagent"
    volumes:
      - agent_screenshots:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pmjobagent
      POSTGRES_PASSWORD: pmjobagent
      POSTGRES_DB: pmjobagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmjobagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  agent_screenshots:
  postgres_data:
